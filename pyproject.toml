[project]
name = "moonphases"
version = "0.1.0"
description = "Generate moon phase calendar SVG images"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
moonphases = "moonphases.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
